# Default-deny for the namespace, then allow only what demo-app needs.
# Enforced only when the VPC CNI network policy agent is enabled on the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app
spec:
  podSelector:
    matchLabels: {app: demo-app}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}   # same namespace only; add an ingress controller namespace later
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:                   # DNS only; the app makes no other outbound calls
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
